services:
  - type: web
    name: reviewmind
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m reviewmind.app
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: OPENAI_API_KEY
        sync: false  # Will prompt you for this value on Render
      - key: GITHUB_TOKEN
        sync: false  # Will prompt you for this value on Render
      - key: GITHUB_WEBHOOK_SECRET
        sync: false  # Will prompt you for this value on Render
      - key: DATABASE_URL
        fromDatabase:
          name: reviewmind-db
          property: connectionString

databases:
  - name: reviewmind-db
    plan: free
